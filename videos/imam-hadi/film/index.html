<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قصيدة الإمام الهادي</title>
<style>
@font-face{font-family:Amiri;font-weight:700;src:url(assets/fonts/Amiri-Bold.ttf)}
@font-face{font-family:Ruqaa;font-weight:700;src:url(assets/fonts/ArefRuqaa-Bold.ttf)}
@font-face{font-family:Cairo;font-weight:800;src:url(assets/fonts/Cairo_800ExtraBold.ttf)}
:root{--gold:#f2c46d;--light:#fff3d6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
canvas{position:absolute;inset:0;width:1080px;height:1920px}
#glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(circle,rgba(255,252,240,1) 0%,rgba(255,246,215,.92) 18%,rgba(255,228,170,.5) 38%,rgba(255,210,130,.16) 58%,rgba(255,200,120,0) 72%)}
#shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 50%,rgba(0,0,0,.5) 66%,rgba(0,0,0,.72) 100%)}
#title{position:absolute;top:250px;right:50px;left:50px;text-align:center;opacity:0}
#title .t1{font:700 112px/1.25 Ruqaa;color:var(--gold);text-shadow:0 0 30px rgba(0,0,0,.95),0 4px 4px #000}
#title .t2{font:700 50px/1.4 Amiri;color:var(--light);text-shadow:0 2px 14px #000;margin-top:4px}
#label{position:absolute;top:200px;right:56px;font:700 40px/1 Amiri;color:var(--light);opacity:0;text-shadow:0 2px 10px #000}
#cap{position:absolute;left:60px;right:60px;top:1250px;text-align:center;font:800 70px/1.3 Cairo;color:#fff;
  text-shadow:0 0 20px rgba(0,0,0,.95),0 4px 5px #000;-webkit-text-stroke:3px rgba(0,0,0,.55);paint-order:stroke fill}
#who{position:absolute;left:60px;right:60px;top:1188px;text-align:center;font:700 38px/1 Amiri;opacity:0;text-shadow:0 2px 10px #000}
#verse{position:absolute;left:40px;right:40px;top:1060px;text-align:center}
#verse div{font:700 76px/1.55 Amiri;color:var(--light);opacity:0;
  text-shadow:0 0 22px rgba(255,214,140,.55),0 0 6px rgba(0,0,0,.9),0 4px 6px #000}
#verse div.b{color:var(--gold)}
#hookv{position:absolute;left:40px;right:40px;top:1180px;text-align:center;font:700 88px/1.4 Amiri;color:var(--light);
  text-shadow:0 0 26px rgba(255,214,140,.7),0 4px 6px #000}
#hookv span{opacity:0}
#dust{position:absolute;inset:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="glow"></div>
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="shade"></div>
  <div id="label">الإمام علي الهادي عليه السلام</div>
  <div id="title"><div class="t1">القصيدة التي أبكت المتوكل</div><div class="t2">الإمام علي الهادي عليه السلام</div></div>
  <div id="hookv"></div>
  <div id="verse"><div id="h1"></div><div id="h2" class="b"></div></div>
  <div id="who"></div>
  <div id="cap"></div>
  <div id="fade"></div>
</div>
<script src="data.js"></script>
<script>
// ===== WebGL: صورة + خريطة عمق → كاميرا ثلاثية الأبعاد (parallax) =====
const gl = document.getElementById("gl").getContext("webgl", {preserveDrawingBuffer: true, antialias: false});
const VS = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; uv.y = 1.0-uv.y; gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float; varying vec2 uv;
uniform sampler2D uImg, uDep; uniform float uZoom, uDolly, uFocus, uBright, uFlick, uTime, uWarm;
uniform vec2 uCam, uCenter;
float dep(vec2 q){ return texture2D(uDep, q).r; }
void main(){
  vec2 c = uCenter; vec2 q = uv;
  for(int i=0;i<4;i++){ float d = dep(q) - uFocus; q = c + (uv - c) / (uZoom * (1.0 + uDolly * d)) - uCam * d; }
  q = clamp(q, 0.001, 0.999);
  vec3 col = texture2D(uImg, q).rgb;
  // تدرّج موحّد: ظلال زرقاء مخضرّة وإضاءة ذهبية
  float l = dot(col, vec3(.299,.587,.114));
  vec3 tone = mix(vec3(.05,.12,.15), vec3(1.,.82,.55), smoothstep(.1,.85,l)) * (0.4 + l);
  col = mix(col, tone, .22 + .1*uWarm);
  // وميض الشموع
  float fl = 1.0 + uFlick * (0.05*sin(uTime*13.0) + 0.035*sin(uTime*7.3+1.7) + 0.025*sin(uTime*23.1));
  col *= uBright * fl;
  // تظليل الأطراف وحبيبات الفيلم
  vec2 v = uv - .5; col *= 1.0 - dot(v*vec2(1.1,0.75), v*vec2(1.1,0.75)) * 0.9;
  float n = fract(sin(dot(uv*vec2(1080.,1920.) + uTime*61.0, vec2(12.9898,78.233))) * 43758.5453);
  col += (n - .5) * .035;
  gl_FragColor = vec4(col, 1.);
}`;
function sh(t, s){ const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
gl.uniform1i(U("uImg"), 0); gl.uniform1i(U("uDep"), 1);
function tex(img){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE)); return t; }
const TEX = {};
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

// ===== حركة الكاميرا لكل نوع =====
const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
function cam(m, p){
  const e = ease(p), L = p; // L خطي
  switch(m){
    case "in":    return {z: 1.0 + .10*L, dolly: .10*L, cam: [0, 0]};
    case "out":   return {z: 1.12 - .10*L, dolly: .10*(1-L), cam: [0, 0]};
    case "left":  return {z: 1.08, dolly: .04, cam: [-.035 + .07*L, 0]};
    case "right": return {z: 1.08, dolly: .04, cam: [.035 - .07*L, 0]};
    case "up":    return {z: 1.08, dolly: .04, cam: [0, .03 - .06*L]};
    case "down":  return {z: 1.08, dolly: .04, cam: [0, -.03 + .06*L]};
    case "push":  return {z: 1.0 + .18*e, dolly: .22*e, cam: [0, 0]};
    case "orbit": return {z: 1.06 + .04*L, dolly: .06, cam: [.05*Math.sin(L*2.2 - 1.1), .012*Math.cos(L*2.2)]};
    default:      return {z: 1.04 + .04*L, dolly: .05*L, cam: [0, 0]};
  }
}

// ===== الغبار =====
const dctx = document.getElementById("dust").getContext("2d");
const P = Array.from({length: 70}, (_, i) => ({x: (i*397)%1080, y: (i*733)%1920, r: 1 + (i%4), s: .15 + (i%7)*.05, ph: i*1.3}));
function dust(t, amt){
  dctx.clearRect(0, 0, 1080, 1920); if (!amt) return;
  for (const q of P){
    const x = (q.x + Math.sin(t*q.s + q.ph)*40 + t*8*q.s) % 1080, y = (q.y - t*22*q.s + 1920*4) % 1920;
    const a = amt * (.25 + .25*Math.sin(t*1.7 + q.ph));
    dctx.fillStyle = `rgba(255,228,180,${a.toFixed(3)})`; dctx.beginPath(); dctx.arc(x, y, q.r, 0, 6.283); dctx.fill();
  }
}

// ===== النصوص =====
const $ = id => document.getElementById(id);
const CAPS = [];   // [text, start, end, who]
for (const blk of DATA.words){
  if (/^v\d|hook/.test(blk.tag)) continue;
  const ws = blk.words; const who = blk.who;
  let i = 0;
  while (i < ws.length){
    let n = 3; const chunk = ws.slice(i, i + n);
    // اقطع عند علامات الوقف
    for (let k = 0; k < chunk.length - 1; k++) if (/[.،:!؟?]$/.test(chunk[k][0])) { n = k + 1; break; }
    const c = ws.slice(i, i + n);
    let sp = who;
    if (who === "RM") sp = i >= 2 ? "M" : "R";   // «فأعفاه، وقال:» ثم كلام المتوكل
    if (who === "MR") sp = i >= 4 ? "R" : "M";   // «لا بدّ أن تنشدني!» ثم «فأنشده:»
    const end = i + n < ws.length ? ws[i + n][1] : c[c.length - 1][2] + .25;
    CAPS.push([c.map(w => w[0]).join(" "), c[0][1] - .05, end, sp]);
    i += n;
  }
}
const VERSES = DATA.words.filter(b => /^v\d/.test(b.tag)).map(b => {
  const ws = b.words, half = DATA.poem[+b.tag.slice(1) - 1].split(" ... ");
  const n1 = half[0].split(" ").length;
  return {a: ws[0][1] - .1, b: ws[n1][1] - .1, end: ws[ws.length-1][2] + .5, h1: half[0], h2: half[1]};
});
const HOOK = DATA.words.find(b => b.tag === "hook").words;
$("hookv").innerHTML = HOOK.map(w => `<span>${w[0]}</span>`).join(" ");
const WHO = {M: ["المتوكل", "#ff9b6b"], I: ["الإمام", "#f2c46d"]};

function setText(t){
  // العنوان: من الإطار الأول حتى بداية القصة
  $("title").style.opacity = t < 11.6 ? 1 : Math.max(0, 1 - (t - 11.6) / .4);
  $("label").style.opacity = t > 12.2 && t < 78.6 ? .85 : (t > 130.6 ? .85 : 0);
  // بيت الخطاف كلمة كلمة
  [...$("hookv").children].forEach((s, i) => s.style.opacity = t >= HOOK[i][1] - .08 ? Math.min(1, (t - HOOK[i][1] + .08) / .2) : 0);
  $("hookv").style.opacity = t < 4.0 ? 1 : Math.max(0, 1 - (t - 4.0) / .3);
  // الأبيات
  const v = VERSES.find(x => t >= x.a && t < x.end);
  if (v){ $("h1").textContent = v.h1; $("h2").textContent = v.h2;
    $("h1").style.opacity = Math.min(1, (t - v.a) / .35); $("h2").style.opacity = t >= v.b ? Math.min(1, (t - v.b) / .35) : 0;
    const out = v.end - t; if (out < .35) { $("h1").style.opacity *= out/.35; $("h2").style.opacity *= out/.35; }
    $("h1").style.filter = $("h2").style.filter = "none";
  } else { $("h1").style.opacity = $("h2").style.opacity = 0; }
  // الترجمة
  const c = !v && t > 4.0 ? CAPS.find(x => t >= x[1] && t < x[2]) : null;
  $("cap").textContent = c ? c[0] : "";
  const w = c && WHO[c[3]];
  $("cap").style.color = w ? w[1] : "#fff";
  $("who").textContent = w ? w[0] : ""; $("who").style.color = w ? w[1] : ""; $("who").style.opacity = w ? .95 : 0;
}

// ===== اللقطات =====
const SHOTS = DATA.shots;  // {img, a, b, m, bright, flick, dust, glow:[x,y,r]}
function shotAt(t){ let s = SHOTS[0]; for (const x of SHOTS) if (t >= x.a) s = x; return s; }
function render(t){
  const s = shotAt(t), i = SHOTS.indexOf(s), nxt = SHOTS[i + 1];
  const p = Math.min(1, Math.max(0, (t - s.a) / (s.b - s.a)));
  const k = cam(s.m, p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, TEX[s.img].img);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, TEX[s.img].dep);
  gl.uniform1f(U("uZoom"), k.z); gl.uniform1f(U("uDolly"), k.dolly); gl.uniform2f(U("uCam"), k.cam[0], k.cam[1]);
  gl.uniform1f(U("uFocus"), s.focus ?? .45); gl.uniform2f(U("uCenter"), s.cx ?? .5, s.cy ?? .5);
  gl.uniform1f(U("uBright"), s.bright ?? 1.0); gl.uniform1f(U("uFlick"), s.flick ?? 0); gl.uniform1f(U("uTime"), t);
  gl.uniform1f(U("uWarm"), s.warm ?? 0);
  gl.viewport(0, 0, 1080, 1920); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // نور وجه الإمام: نبض هادئ، ويتبع حركة الكاميرا تقريباً
  const g = $("glow");
  if (s.glow){
    const [gx, gy, gr] = s.glow, pulse = 1 + .08*Math.sin(t*2.4) + .04*Math.sin(t*5.1);
    const cx = s.cx ?? .5, cy = s.cy ?? .5;
    const X = (cx + (gx - cx) * k.z * (1 + k.dolly*.3) + k.cam[0]*.3) * 1080, Y = (cy + (gy - cy) * k.z * (1 + k.dolly*.3) + k.cam[1]*.3) * 1920;
    const R = gr * 1080 * pulse * k.z;
    Object.assign(g.style, {left: (X - R) + "px", top: (Y - R) + "px", width: 2*R + "px", height: 2*R + "px", opacity: (.85 + .15*Math.sin(t*1.7)).toFixed(3)});
  } else g.style.opacity = 0;
  dust(t, s.dust ?? .5);
  // انتقالات: قطع مباشر، إلا ما عُلّم fade
  let f = 0;
  if (nxt && nxt.fade && t > s.b - .35) f = (t - (s.b - .35)) / .35;
  if (s.fade && t < s.a + .35) f = Math.max(f, 1 - (t - s.a) / .35);
  if (t > DATA.duration - 1.2) f = Math.max(f, (t - (DATA.duration - 1.2)) / 1.2);
  $("fade").style.opacity = Math.min(1, f).toFixed(3);
  setText(t);
}
window.DUR = DATA.duration;
window.seek = t => render(t);
window.ready = (async () => {
  await document.fonts.ready;
  for (const id of [...new Set(SHOTS.map(s => s.img))]){
    const [im, dp] = await Promise.all([loadImg(`assets/img/${id}.jpg`), loadImg(`assets/img/${id}_d.png`)]);
    TEX[id] = {img: tex(im), dep: tex(dp)};
  }
  render(0);
})();
</script>
</body>
</html>
